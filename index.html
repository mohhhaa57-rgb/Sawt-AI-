<div class="tts-container">
    <textarea id="textInput" placeholder="اكتب النص هنا لتحويله إلى صوت..."></textarea>
    
    <label for="voiceSelect">اختر النبرة:</label>
    <select id="voiceSelect">
        <option value="alloy">ذكر (واقعي - Alloy)</option>
        <option value="nova">أنثى (واقعي - Nova)</option>
        <option value="shimmer">طفل / صوت ناعم (Shimmer)</option>
        <option value="echo">صوت إلكتروني / آلي (Echo)</option>
    </select>

    <div class="buttons">
        <button onclick="generateAudio('play')">🔊 استماع للصوت</button>
        <button onclick="generateAudio('download')" class="download-btn">📥 تنزيل كملف MP3</button>
    </div>

    <audio id="audioPlayer" controls style="display:none; margin-top: 15px;"></audio>
</div>

<script>
async function generateAudio(action) {
    const text = document.getElementById('textInput').value;
    const voice = document.getElementById('voiceSelect').value;

    if (!text.trim()) {
        alert('الرجاء كتابة نص أولاً!');
        return;
    }

    // إرسال الطلب إلى السيرفر (Backend) الخاص بك
    try {
        const response = await fetch('/api/text-to-speech', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, voice })
        });

        if (!response.ok) throw new Error('فشل توليد الصوت');

        const blob = await response.blob();
        const audioUrl = URL.createObjectURL(blob);

        if (action === 'play') {
            const player = document.getElementById('audioPlayer');
            player.src = audioUrl;
            player.style.display = 'block';
            player.play();
        } else if (action === 'download') {
            const a = document.createElement('a');
            a.href = audioUrl;
            a.download = 'speech-output.mp3';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    } catch (error) {
        console.error(error);
        alert('حدث خطأ أثناء معالجة الصوت.');
    }
}
</script>
