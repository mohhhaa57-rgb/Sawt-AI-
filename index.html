<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceAI - تحويل النص إلى صوت</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="navbar">
        <div class="logo-container">
            <i class="fa-solid fa-microphone-lines logo-icon"></i>
            <span class="logo-text">Voice<span class="highlight">AI</span></span>
        </div>
        <button id="themeToggle" class="theme-btn" type="button" title="تبديل الوضع">
            <i id="themeIcon" class="fa-solid fa-moon"></i>
        </button>
    </header>

    <main class="main-container">
        <div class="hero-section">
            <span class="badge"><i class="fa-solid fa-wand-magic-sparkles"></i> مدعوم بالذكاء الاصطناعي</span>
            <h1>حوّل النص إلى صوت <span class="gradient-text">طبيعي وفخم</span></h1>
            <p>اكتب النص واقْرأه بأفضل النبرات والأصوات المتاحة.</p>
        </div>

        <div class="card-generator">
            <div class="card-header">
                <h2><i class="fa-solid fa-sliders"></i> لوحة التحكم</h2>
                <span id="charCount" class="char-count">0 / 1000</span>
            </div>

            <div class="input-group">
                <textarea id="textInput" placeholder="اكتب أو الصق النص هنا للتحويل إلى صوت..." maxlength="1000"></textarea>
            </div>

            <div class="setting-row">
                <label for="languageSelect"><i class="fa-solid fa-globe"></i> اللغة / اللهجة</label>
                <select id="languageSelect">
                    <option value="ar" selected>العربية</option>
                    <option value="en">الإنجليزية</option>
                    <option value="fr">الفرنسية</option>
                    <option value="de">الألمانية</option>
                    <option value="tr">التركية</option>
                </select>
            </div>

            <div class="setting-row">
                <label for="voiceSelect"><i class="fa-solid fa-microphone-audio"></i> نبرة الصوت</label>
                <div class="voice-select-wrapper">
                    <select id="voiceSelect"></select>
                    <button id="previewVoiceBtn" type="button"><i class="fa-solid fa-volume-high"></i> معاينة</button>
                </div>
            </div>

            <div class="setting-row">
                <div class="slider-header">
                    <label for="rateRange"><i class="fa-solid fa-gauge-high"></i> سرعة الكلام</label>
                    <span id="rateValue">1.0x</span>
                </div>
                <input type="range" id="rateRange" min="0.5" max="2.0" step="0.1" value="1.0">
            </div>

            <button id="generateBtn" class="generate-btn" type="button">
                <span>تشغيل الصوت</span>
                <i class="fa-solid fa-bolt"></i>
            </button>

            <div id="outputSection" class="output-section hidden">
                <div class="wave-animation">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
                <p class="status-text"><i class="fa-solid fa-circle-check"></i> يتم تشغيل الصوت بنجاح!</p>
                <button id="playBtn" class="action-sub-btn" type="button"><i class="fa-solid fa-play"></i> إعادة الاستماع</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
