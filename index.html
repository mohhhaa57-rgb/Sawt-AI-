<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceAI - تحويل النص إلى صوت فائق الواقعية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- الهيدر وشريط التنقل -->
    <header class="navbar">
        <div class="logo-container">
            <i class="fa-solid fa-microphone-lines logo-icon"></i>
            <span class="logo-text">Voice<span class="highlight">AI</span></span>
        </div>
        <button id="themeToggle" class="theme-btn" type="button" title="تبديل الوضع الليلي والنهاري">
            <i id="themeIcon" class="fa-solid fa-moon"></i>
        </button>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="main-container">
        <div class="hero-section">
            <span class="badge"><i class="fa-solid fa-wand-magic-sparkles"></i> مدعوم بالذكاء الاصطناعي</span>
            <h1>حوّل النص إلى صوت <span class="gradient-text">طبيعي وفخم</span></h1>
            <p>اكتب النص الذي تريده، اختر اللهجة المناسبة ونبرة الصوت، ثم أنشئ صوتاً احترافياً بجودة عالية.</p>
        </div>

        <div class="card-generator">
            <div class="card-header">
                <h2><i class="fa-solid fa-sliders"></i> لوحة التحكم</h2>
                <span id="charCount" class="char-count">0 / 1000</span>
            </div>

            <!-- حقل النص -->
            <div class="input-group">
                <textarea id="textInput" placeholder="اكتب أو الصق النص هنا للتحويل إلى صوت..." maxlength="1000"></textarea>
            </div>

            <!-- اختيار اللغة / اللهجة -->
            <div class="setting-row">
                <label for="languageSelect"><i class="fa-solid fa-globe"></i> اللغة / اللهجة</label>
                <select id="languageSelect">
                    <option value="ar-IQ">العربية (اللهجة العراقية)</option>
                    <option value="ar-SA">العربية (اللهجة السعودية / الخليجية)</option>
                    <option value="ar-AE">العربية (اللهجة الإماراتية)</option>
                    <option value="ar-EG">العربية (اللهجة المصرية)</option>
                    <option value="ar-MA">العربية (اللهجة المغربية)</option>
                    <option value="ar-SA" selected>العربية الفصحى (Standard)</option>
                    <option value="en-US">الإنجليزية (أمريكي)</option>
                    <option value="en-GB">الإنجليزية (بريطاني)</option>
                    <option value="fr-FR">الفرنسية</option>
                    <option value="de-DE">الألمانية</option>
                    <option value="es-ES">الإسبانية</option>
                    <option value="tr-TR">التركية</option>
                </select>
            </div>

            <!-- اختيار الصوت والنبرة + زر معاينة الصوت -->
            <div class="setting-row">
                <label for="voiceSelect"><i class="fa-solid fa-microphone-audio"></i> نبرة الصوت</label>
                <div class="voice-select-wrapper">
                    <select id="voiceSelect">
                        <!-- يتم تعبئتها ديناميكياً -->
                    </select>
                    <button id="previewVoiceBtn" type="button" title="استماع لعينة من الصوت المختار">
                        <i class="fa-solid fa-volume-high"></i> معاينة
                    </button>
                </div>
            </div>

            <!-- سرعة الكلام (شريط تمرير Slider) -->
            <div class="setting-row">
                <div class="slider-header">
                    <label for="rateRange"><i class="fa-solid fa-gauge-high"></i> سرعة الكلام</label>
                    <span id="rateValue">1.0x</span>
                </div>
                <input type="range" id="rateRange" min="0.5" max="2.0" step="0.1" value="1.0">
            </div>

            <!-- زر التوليد -->
            <button id="generateBtn" class="generate-btn" type="button">
                <span>تحويل النص إلى صوت</span>
                <i class="fa-solid fa-bolt"></i>
            </button>

            <!-- مؤشر الموجات الصوتية وقسم النتيجة -->
            <div id="outputSection" class="output-section hidden">
                <div class="wave-animation">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
                <div class="audio-player-box">
                    <p class="status-text"><i class="fa-solid fa-circle-check"></i> تم توليد وتفعيل الصوت بنجاح!</p>
                    <div class="action-buttons">
                        <button id="playBtn" class="action-sub-btn" type="button"><i class="fa-solid fa-play"></i> إعادة الاستماع</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
