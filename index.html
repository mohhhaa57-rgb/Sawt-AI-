<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceAI - تحويل النص إلى صوت فائق الواقعية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- الهيدر وشريط التنقل -->
    <header class="navbar">
        <div class="logo-container">
            <i class="fa-solid fa-microphone-lines logo-icon"></i>
            <span class="logo-text">Voice<span class="highlight">AI</span></span>
        </div>
        <button id="themeToggle" class="theme-btn" title="تبديل الوضع الليلي">
            <i class="fa-solid fa-moon"></i>
        </button>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="main-container">
        <div class="hero-section">
            <span class="badge"><i class="fa-solid fa-wand-magic-sparkles"></i> مدعوم بالذكاء الاصطناعي</span>
            <h1>حوّل النص إلى صوت <span class="gradient-text">طبيعي وفخم</span></h1>
            <p>اكتب النص الذي تريده، اختر اللهجة المناسبة ونبرة الصوت، ثم أنشئ صوتاً احترافياً بجودة عالية.</p>
        </div>

        <div class="card-generator">
            <div class="card-header">
                <h2><i class="fa-solid fa-sliders"></i> لوحة التحكم</h2>
                <span id="charCount" class="char-count">0 / 1000</span>
            </div>

            <!-- حقل النص -->
            <div class="input-group">
                <textarea id="textInput" placeholder="اكتب أو الصق النص هنا للتحويل إلى صوت..." maxlength="1000"></textarea>
            </div>

            <!-- اختيار اللغة / اللهجة -->
            <div class="setting-row">
                <label for="languageSelect"><i class="fa-solid fa-globe"></i> اللغة / اللهجة</label>
                <select id="languageSelect">
                    <option value="ar-IQ">العربية (اللهجة العراقية)</option>
                    <option value="ar-SA">العربية (اللهجة السعودية / الخليجية)</option>
                    <option value="ar-EG">العربية (اللهجة المصرية)</option>
                    <option value="ar-AR" selected>العربية الفصحى (Standard)</option>
                    <option value="en-US">الإنجليزية (أمريكي)</option>
                    <option value="fr-FR">الفرنسية</option>
                </select>
            </div>

            <!-- اختيار الصوت والنبرة -->
            <div class="setting-row">
                <label for="voiceSelect"><i class="fa-solid fa-microphone-audio"></i> نبرة الصوت</label>
                <select id="voiceSelect">
                    <!-- سيتم تعبئتها ديناميكياً عبر الجافاسكريبت -->
                </select>
            </div>

            <!-- سرعة الكلام -->
            <div class="setting-row">
                <label for="rateSelect"><i class="fa-solid fa-gauge-high"></i> سرعة الكلام</label>
                <select id="rateSelect">
                    <option value="0.8">بطيء وواضح</option>
                    <option value="1" selected>طبيعي</option>
                    <option value="1.25">سريع</option>
                </select>
            </div>

            <!-- زر التوليد مع تأثيرات -->
            <button id="generateBtn" class="generate-btn">
                <span>تحويل النص إلى صوت</span>
                <i class="fa-solid fa-bolt"></i>
            </button>

            <!-- مؤشر الموجات الصوتية وقسم المعاينة والتحميل -->
            <div id="outputSection" class="output-section hidden">
                <div class="wave-animation">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
                <div class="audio-player-box">
                    <audio id="audioPreview" controls style="display:none;"></audio>
                    <p class="status-text"><i class="fa-solid fa-circle-check"></i> تم توليد الصوت بنجاح!</p>
                    <div class="action-buttons">
                        <button id="playBtn" class="action-sub-btn"><i class="fa-solid fa-play"></i> استماع</button>
                        <button id="downloadBtn" class="action-sub-btn download"><i class="fa-solid fa-download"></i> تحميل الصوت</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
