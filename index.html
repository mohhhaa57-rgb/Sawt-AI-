<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceAI - محول النص إلى صوت احترافي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>محول الصوت الذكي (VoiceAI) 🎙️</h1>
            <p>حول أي نص إلى صوت بشري واقعي واحترافي بضغطة زر</p>
        </header>

        <div class="input-group">
            <label for="textInput">النص المراد تحويله:</label>
            <textarea id="textInput" placeholder="اكتب النص هنا باللغة العربية..."></textarea>
        </div>

        <div class="settings-row">
            <div class="setting-item">
                <label for="voiceSelect">اختر الصوت:</label>
                <select id="voiceSelect">
                    <option value="21m00Tcm4TlvDq8ikWAM">آدم (رجل - عميق ورسمي)</option>
                    <option value="EXAVITQu4vr4xnSDxMaL">راشيل (امرأة - هادئة)</option>
                </select>
            </div>
        </div>

        <button id="convertBtn" class="btn-generate">تحويل وتنزيل كـ MP3 🎵</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
