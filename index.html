<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sawt-AI - تحويل النص إلى صوت</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 min-h-screen text-white flex flex-col justify-between">

    <!-- Header -->
    <header class="p-6 text-center border-b border-white/10 backdrop-blur-md">
        <h1 class="text-3xl font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">
            <i class="fa-solid fa-microphone-lines ml-2"></i>Sawt-AI
        </h1>
        <p class="text-slate-400 text-sm mt-1">حول أي نص إلى تعليق صوتي فوري بالذكاء الاصطناعي</p>
    </header>

    <!-- Main Content -->
    <main class="max-w-2xl w-full mx-auto p-4 md:p-6 my-auto">
        <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-6 shadow-2xl border border-white/15">
            
            <!-- Textarea -->
            <div class="mb-4">
                <label class="block text-sm font-medium mb-2 text-slate-300">أدخل النص المراد تحويله:</label>
                <textarea id="textInput" rows="5" class="w-full bg-slate-900/60 border border-slate-700 rounded-xl p-4 text-white focus:outline-none focus:ring-2 focus:ring-purple-500 placeholder-slate-500 resize-none" placeholder="اكتب أو الصق النص هنا باللغة العربية أو الإنجليزية..."></textarea>
            </div>

            <!-- Voice Settings -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-medium mb-2 text-slate-300">اختر الصوت / اللهجة:</label>
                    <select id="voiceSelect" class="w-full bg-slate-900/60 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
                        <option value="">جاري تحميل الأصوات...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2 text-slate-300">السرعة (<span id="speedVal">1</span>x):</label>
                    <input type="range" id="rateRange" min="0.5" max="2" step="0.1" value="1" class="w-full accent-purple-500 mt-3 cursor-pointer">
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-3">
                <button onclick="speakText()" class="flex-1 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold py-3 px-6 rounded-xl transition shadow-lg flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-play"></i> تشغيل الصوت
                </button>
                <button onclick="stopSpeech()" class="bg-rose-600/80 hover:bg-rose-600 text-white font-bold py-3 px-4 rounded-xl transition flex items-center justify-center cursor-pointer" title="إيقاف">
                    <i class="fa-solid fa-stop"></i>
                </button>
            </div>
        </div>

        <!-- Placeholder for Ads (Adsterra / Banner) -->
        <div class="mt-8 bg-white/5 border border-dashed border-white/20 rounded-xl p-4 text-center text-slate-400 text-sm">
            <span>مساحة إعلانية (ضع كود إعلانات Adsterra هنا لاحقاً)</span>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t border-white/10">
        جميع الحقوق محفوظة &copy; 2026 Sawt-AI
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const synth = window.speechSynthesis;
        const textInput = document.getElementById('textInput');
        const voiceSelect = document.getElementById('voiceSelect');
        const rateRange = document.getElementById('rateRange');
        const speedVal = document.getElementById('speedVal');

        let voices = [];

        function populateVoices() {
            voices = synth.getVoices();
            voiceSelect.innerHTML = '';
            
            // تصفية وترتيب الأصوات المتاحة في المتصفح
            voices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${voice.name} (${voice.lang})`;
                voiceSelect.appendChild(option);
            });
        }

        populateVoices();
        if (synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = populateVoices;
        }

        rateRange.addEventListener('input', () => {
            speedVal.textContent = rateRange.value;
        });

        function speakText() {
            if (synth.speaking) {
                synth.cancel();
            }

            const text = textInput.value.trim();
            if (!text) {
                alert('الرجاء كتابة نص أولاً!');
                return;
            }

            const utterance = new SpeechSynthesisUtterance(text);
            const selectedVoiceIndex = voiceSelect.value;
            
            if (voices[selectedVoiceIndex]) {
                utterance.voice = voices[selectedVoiceIndex];
            }

            utterance.rate = parseFloat(rateRange.value);
            synth.speak(utterance);
        }

        function stopSpeech() {
            if (synth.speaking) {
                synth.cancel();
            }
        }
    </script>
</body>
</html>
